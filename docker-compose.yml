  #     - "host.docker.internal:host-gateway"
  #   volumes:
  #     - ./../broadcastai/server:/app
  #     - /app/node_modules
  #   env_file:
  #     - ./../broadcastai/server/.env

volumes:
  admin_next:
  frontend_next:

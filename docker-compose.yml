services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - admin
      - api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env

  admin:
    build:
      context: ./admin
    expose:
      - "3002"
    volumes:
      - ./admin:/app
      - /app/node_modules
    env_file:
      - ./admin/.env

  api:
    build:
      context: ./backend
    network_mode: host
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env

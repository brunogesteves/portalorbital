services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - admin
      - api
      # - streaming
      # - streamingapi
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_next:/app/.next
    env_file:
      - ./frontend/.env
    environment:
      NODE_OPTIONS: --max-old-space-size=1536
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped

  admin:
    build:
      context: ./admin
    expose:
      - "3002"
    volumes:
      - ./admin:/app
      - /app/node_modules
      - admin_next:/app/.next
    env_file:
      - ./admin/.env
    environment:
      NODE_OPTIONS: --max-old-space-size=3072
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped

  api:
    build:
      context: ./backend
    expose:
      - "3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      NODE_OPTIONS: --max-old-space-size=768
    mem_limit: 1280m
    memswap_limit: 1280m
    restart: unless-stopped
  # streaming:
  #   build:
  #     context: ./../broadcastai/client
  #   expose:
  #     - "3004"
  #   volumes:
  #     - ./../broadcastai/client:/app
  #     - /app/node_modules
  #   env_file:
  #     - ./../broadcastai/client/.env

  # streamingapi:
